name: Atualizar M3U - Olhos na TV Brasil

on:
  workflow_dispatch:
  schedule:
    # 00:20, 06:20, 12:20 e 18:20 no horário de Brasília (UTC-3).
    - cron: "20 3,9,15,21 * * *"

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Instalar dependências
        run: python -m pip install -r requirements.txt

      - name: Gerar lista
        run: python gerar_m3u.py

      - name: Verificar arquivo
        run: |
          test -s olhosnatv-brasil.m3u
          grep -q '^#EXTM3U' olhosnatv-brasil.m3u

      - name: Commit e push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add olhosnatv-brasil.m3u
          if git diff --cached --quiet; then
            echo "Nenhuma alteração na lista."
          else
            git commit -m "Atualiza lista M3U Olhos na TV"
            git push
          fi
