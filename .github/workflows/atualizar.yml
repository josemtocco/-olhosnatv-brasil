name: Atualizar M3U - Olhos na TV

on:
  workflow_dispatch:
  schedule:
    - cron: "20 3,9,15,21 * * *"

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Instalar dependências
        run: python -m pip install -r requirements.txt

      - name: Gerar lista M3U com nomes dos canais
        run: python gerar_m3u.py

      - name: Validar lista
        run: |
          test -s olhosnatv.m3u
          grep -q '^#EXTM3U' olhosnatv.m3u
          grep -q 'tvg-name=' olhosnatv.m3u
          grep -q 'group-title=' olhosnatv.m3u

      - name: Commit e push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add olhosnatv.m3u
          if git diff --cached --quiet; then
            echo "Nenhuma alteração na lista."
          else
            git commit -m "Atualiza nomes dos canais e categorias"
            git push
          fi
